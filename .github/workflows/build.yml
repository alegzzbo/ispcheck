name: build

on:
  push:
    tags: ["v*"]
  # Ручной запуск на ветке main ПРОГРЕВАЕТ КЭШ: тег-сборки читают кэш только из main,
  # поэтому без прогрева каждая тег-сборка компилирует все зависимости с нуля.
  # Запускайте после изменения Cargo.lock (Actions -> build -> Run workflow, ветка main).
  workflow_dispatch:

# Новый запуск отменяет незавершённый запуск той же ветки или тега
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  # Тесты идут параллельно со сборками, в debug-профиле (не компилируют проект второй раз с LTO)
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test
      - run: cargo test --no-default-features --features cli

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: ispcheck.exe, out: ispcheck-windows-amd64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: ispcheck, out: ispcheck-linux-amd64 } # старый glibc
          # консольная версия (без окна и OpenGL): статический бинарь, работает на любом Linux, в том числе старом и без графики
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, bin: ispcheck, out: ispcheck-cli-linux-amd64, args: "--no-default-features --features cli", musl: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ env.PROFILE }}-${{ matrix.args }}

      # Тег vX.Y.Z -> версия в Cargo.toml (показывается в окне и проверяется автообновлением)
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = ".*?"/version = "$ENV{V}"/m' Cargo.toml

      - name: Build
        shell: bash
        env:
          # Windows: статическая CRT, чтобы не требовался VC++ Redistributable
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --profile "$PROFILE" --target "${{ matrix.target }}" ${{ matrix.args }}
          cp "target/${{ matrix.target }}/$PROFILE/${{ matrix.bin }}" "${{ matrix.out }}"

      - name: SHA-256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.out }}" > "${{ matrix.out }}.sha256";
          else shasum -a 256 "${{ matrix.out }}" > "${{ matrix.out }}.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}
            ${{ matrix.out }}.sha256
          if-no-files-found: error

  # macOS: ОДНО задание на всё (обе архитектуры, склейка, .app и .dmg), чтобы ждать раннер macOS один раз, а не три
  macos:
    # Метку можно сменить без правки файла: Settings -> Secrets and variables -> Actions -> Variables -> MACOS_RUNNER
    # (например macos-26, если macos-15 перегружен). Сбой этого задания не блокирует релиз Windows и Linux.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal-${{ env.PROFILE }}

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = ".*?"/version = "$ENV{V}"/m' Cargo.toml

      - name: Build and package .dmg
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          cargo build --profile "$PROFILE" --target aarch64-apple-darwin
          cargo build --profile "$PROFILE" --target x86_64-apple-darwin
          lipo -create -output ispcheck-universal \
            "target/aarch64-apple-darwin/$PROFILE/ispcheck" "target/x86_64-apple-darwin/$PROFILE/ispcheck"
          mkdir -p out
          bash packaging/macos/package.sh ispcheck-universal "$VERSION" out
          (cd out && shasum -a 256 ispcheck-macos-universal.dmg > ispcheck-macos-universal.dmg.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ispcheck-macos-universal.dmg
          path: |
            out/ispcheck-macos-universal.dmg
            out/ispcheck-macos-universal.dmg.sha256
          if-no-files-found: error

  android:
    # Сбой этого задания не блокирует релиз Windows, Linux и macOS.
    # Подпись: секреты ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KS_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS.
    # Без них APK подписывается временным debug-ключом (обновление поверх прошлой версии не пройдёт).
    # Ключ в репозитории не хранится.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.PROFILE }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: cargo install cargo-ndk --locked

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = ".*?"/version = "$ENV{V}"/m' Cargo.toml

      - name: Icons from favicon.ico
        run: |
          if [ -f favicon.ico ]; then pip install pillow && python3 android/make-icons.py favicon.ico; fi

      - name: Rust (.so)
        run: bash android/build-rust.sh

      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK
        env:
          ANDROID_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          gradle -p android assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp android/app/build/outputs/apk/release/app-release.apk ispcheck-android.apk
          sha256sum ispcheck-android.apk > ispcheck-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ispcheck-android.apk
          path: |
            ispcheck-android.apk
            ispcheck-android.apk.sha256
          if-no-files-found: error

  release:
    # Релиз выходит, если прошли тесты и сборки Windows/Linux; dmg для macOS добавится, если он собрался.
    # Если macOS не собрался (нет раннера): Re-run failed jobs, затем Re-run job «release».
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.test.result == 'success' && needs.build.result == 'success'
    needs: [test, build, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ispcheck-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
