name: build

on:
  push:
    tags: ["v*"]
  # Ручной запуск на ветке main ПРОГРЕВАЕТ КЭШ: тег-сборки читают кэш только из main,
  # поэтому без прогрева каждая тег-сборка компилирует все зависимости с нуля.
  # Запускайте после изменения Cargo.lock (Actions -> build -> Run workflow, ветка main).
  workflow_dispatch:

# Новый запуск отменяет незавершённый запуск той же ветки или тега
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  # Тесты идут параллельно со сборками, в debug-профиле
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test

  # Сборка под Windows и Linux
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: ispcheck.exe, out: ispcheck-windows-amd64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: ispcheck, out: ispcheck-linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ env.PROFILE }}

      # Тег vX.Y.Z -> версия в Cargo.toml
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: perl -0pi -e 's/^version = ".*?"/version = "${GITHUB_REF_NAME#v}"/m' Cargo.toml

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --profile "$PROFILE" --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/$PROFILE/${{ matrix.bin }}" "${{ matrix.out }}"

      - name: SHA-256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.out }}" > "${{ matrix.out }}.sha256";
          else shasum -a 256 "${{ matrix.out }}" > "${{ matrix.out }}.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}${{ matrix.out }}.sha256
          if-no-files-found: error
          retention-days:
