name: build

on:
  push:
    #branches: [main]
    tags: ["v*"]
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ispcheck-windows-amd64.exe
          - os: ubuntu-22.04 # старый glibc: бинарь запустится на большинстве дистрибутивов
            name: ispcheck-linux-amd64
          - os: macos-latest
            name: ispcheck-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # Тег vX.Y.Z -> версия в Cargo.toml (она показывается в окне и проверяется автообновлением)
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        #run: perl -0pi -e 's/^version = ".*?"/version = "${GITHUB_REF_NAME#v}"/m' Cargo.toml
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml

      - name: Test
        run: cargo test --release

      - name: "Build (Windows, статическая CRT, без VC++ Redistributable)"
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          cp target/release/ispcheck.exe "${{ matrix.name }}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cp target/release/ispcheck "${{ matrix.name }}"

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output "${{ matrix.name }}" \
            target/aarch64-apple-darwin/release/ispcheck \
            target/x86_64-apple-darwin/release/ispcheck

      - name: SHA-256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256";
          else shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
