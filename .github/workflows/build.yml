name: build

on:
  push:
    tags: ["v*"]
  # Ручной запуск на ветке main ПРОГРЕВАЕТ КЭШ: тег-сборки читают кэш только из main,
  # поэтому без прогрева каждая тег-сборка компилирует все зависимости с нуля.
  # Запускайте после изменения Cargo.lock (Actions -> build -> Run workflow, ветка main).
  workflow_dispatch:

# Новый запуск отменяет незавершённый запуск той же ветки или тега
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  # Тесты идут параллельно со сборками, в debug-профиле (не компилируют проект второй раз с LTO)
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: ispcheck.exe, out: ispcheck-windows-amd64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: ispcheck, out: ispcheck-linux-amd64 } # старый glibc
          - { os: macos-latest, target: aarch64-apple-darwin, bin: ispcheck, out: tmp-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, bin: ispcheck, out: tmp-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ env.PROFILE }}

      # Тег vX.Y.Z -> версия в Cargo.toml (показывается в окне и проверяется автообновлением)
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: perl -0pi -e 's/^version = ".*?"/version = "${GITHUB_REF_NAME#v}"/m' Cargo.toml

      - name: Build
        shell: bash
        env:
          # Windows: статическая CRT, чтобы не требовался VC++ Redistributable
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --profile "$PROFILE" --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/$PROFILE/${{ matrix.bin }}" "${{ matrix.out }}"

      - name: SHA-256
        if: ${{ !startsWith(matrix.out, 'tmp-') }}
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.out }}" > "${{ matrix.out }}.sha256";
          else shasum -a 256 "${{ matrix.out }}" > "${{ matrix.out }}.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}
            ${{ matrix.out }}.sha256
          if-no-files-found: error
          retention-days: ${{ startsWith(matrix.out, 'tmp-') && 1 || 14 }}

  # Универсальный macOS-бинарь: две архитектуры собираются параллельно, здесь только склейка
build-macos-on-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Zig and LLVM tools
        run: |
          pip install cargo-zigbuild
          sudo apt-get update && sudo apt-get install -y llvm

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-zigbuild-${{ env.PROFILE }}

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: perl -0pi -e 's/^version = ".*?"/version = "${GITHUB_REF_NAME#v}"/m' Cargo.toml

      - name: Compile macOS targets with Zig
        run: |
          cargo zigbuild --profile "$PROFILE" --target aarch64-apple-darwin
          cargo zigbuild --profile "$PROFILE" --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          llvm-lipo -create -output ispcheck-macos-universal \
            "target/aarch64-apple-darwin/$PROFILE/ispcheck" \
            "target/x86_64-apple-darwin/$PROFILE/ispcheck"
          chmod +x ispcheck-macos-universal
          sha256sum ispcheck-macos-universal > ispcheck-macos-universal.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ispcheck-macos-universal
          path: |
            ispcheck-macos-universal
            ispcheck-macos-universal.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ispcheck-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
